services:
  officekit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      MAX_FILES: ${MAX_FILES:-10}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-26214400}
      MAX_TOTAL_UPLOAD_SIZE: ${MAX_TOTAL_UPLOAD_SIZE:-104857600}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      GHOSTSCRIPT_TIMEOUT_MS: ${GHOSTSCRIPT_TIMEOUT_MS:-60000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-300}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-8}
      UPLOAD_DIR: ${UPLOAD_DIR:-/tmp/officekit/uploads}
      GHOSTSCRIPT_PATH: ${GHOSTSCRIPT_PATH-}
      NEXT_TELEMETRY_DISABLED: "1"
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
      npm_config_update_notifier: "false"
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: node
    init: true
    pids_limit: "${PIDS_LIMIT:-256}"
    mem_limit: "${MEM_LIMIT:-512m}"
    cpus: "${CPUS:-1.0}"
    restart: unless-stopped
